<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KelolaRacun</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14b8a6">
</head>
<body>
  <script type="module">
    import { openDB } from './scripts/db.js';
    import { getMembers } from './scripts/services/memberService.js';
    import { isAuthenticated } from './scripts/core/authService.js';

    async function redirectByAuth() {
      try {
        await openDB();
      } catch {
        window.location.replace('screens/00-register.html');
        return;
      }

      const members = await getMembers(true);

      if (!members.length) {
        window.location.replace('screens/00-register.html');
        return;
      }
      if (isAuthenticated()) {
        window.location.replace('screens/02-guild-hall.html');
        return;
      }
      window.location.replace('screens/01-guild-entrance.html');
    }

    redirectByAuth();
  </script>
</body>
</html>
