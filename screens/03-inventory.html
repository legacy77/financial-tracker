<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Family Finance Hub</title>
  <link rel="stylesheet" href="../styles/modern-theme.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="guild-banner" role="banner">
    <div class="container flex items-center justify-between" style="padding-top: var(--space-6); padding-bottom: var(--space-6);">
      <h1 class="guild-banner__title">🏰 Family Finance Hub</h1>
      <div class="flex items-center gap-4">
        <div class="guild-banner__gold font-bold">💰 12.450.000</div>
        <button class="btn btn--secondary" id="themeToggle" aria-label="Ganti tema">🌙</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-8); max-width: 800px;">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="mb-1">Inventory Pouch</h2>
        <p class="text-tertiary">Kelola dompet, rekening bank, dan aset investasi</p>
      </div>
      <button class="btn btn--primary" data-open-modal="pouchModal">+ Pouch Baru</button>
    </div>

    <!-- Pouches List (dynamic) -->
    <div class="card p-6 mb-6">
      <h3 class="mb-4">Daftar Pouch</h3>
      <div class="list pouches-list">
        <p class="text-tertiary text-sm p-4">Memuat pouch...</p>
      </div>
    </div>

    <!-- Selected Pouch Detail & Activity (dynamic) -->
    <div class="card p-6 pouch-detail-section">
      <p class="text-tertiary">Memuat detail pouch...</p>
    </div>
  </main>

  <!-- Modals -->
  <div class="modal" id="pouchModal" role="dialog" aria-modal="true" aria-labelledby="pouchModalTitle">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <div class="modal__header">
        <h3 class="modal__title" id="pouchModalTitle">🏛️ Tambah Pouch Baru</h3>
        <button class="modal__close" aria-label="Tutup">&times;</button>
      </div>
      <form id="pouchModalForm" class="modal__body">
        <div class="modal__form-group">
          <label class="modal__label" for="pouchName">Nama Pouch</label>
          <input type="text" id="pouchName" name="pouchName" class="modal__input" placeholder="Contoh: Gold Pouch, Bank BCA" required>
        </div>
        <div class="modal__form-group">
          <label class="modal__label" for="pouchType">Tipe</label>
          <select id="pouchType" name="pouchType" class="modal__select" required>
            <option value="Cash">💰 Cash</option>
            <option value="Bank">🏦 Bank</option>
            <option value="Investment">🔮 Investasi</option>
            <option value="E-Wallet">📱 E-Wallet</option>
          </select>
        </div>
        <div class="modal__form-group">
          <label class="modal__label" for="pouchBalance">Saldo Awal (IDR)</label>
          <input type="number" id="pouchBalance" name="pouchBalance" class="modal__input" min="0" step="1000" placeholder="0">
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn--ghost modal__close">Batal</button>
          <button type="submit" class="btn btn--primary">Buat Pouch</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="txModal" role="dialog" aria-modal="true" aria-labelledby="invTxTitle">
    <div class="modal__backdrop"></div>
    <div class="modal__content">
      <div class="modal__header">
        <h3 class="modal__title" id="invTxTitle">➕ Tambah Transaksi</h3>
        <button class="modal__close" aria-label="Tutup">&times;</button>
      </div>
      <form id="invTxForm" class="modal__body">
        <div class="modal__form-group">
          <label class="modal__label" for="invPouchId">Pouch</label>
          <select id="invPouchId" name="pouchId" class="modal__select" required></select>
        </div>
        <div class="modal__form-group">
          <label class="modal__label" for="invTxType">Tipe</label>
          <select id="invTxType" name="type" class="modal__select" required>
            <option value="Income">💰 Pemasukan</option>
            <option value="Expense">💸 Pengeluaran</option>
            <option value="Transfer">🔄 Transfer</option>
          </select>
        </div>
        <div class="modal__form-group">
          <label class="modal__label" for="invTxCategory">Kategori</label>
          <input type="text" id="invTxCategory" name="category" class="modal__input" placeholder="Contoh: Gaji, Investasi, Makanan" required>
        </div>
        <div class="modal__form-group">
          <label class="modal__label" for="invTxAmount">Nominal (IDR)</label>
          <input type="number" id="invTxAmount" name="amount" class="modal__input" min="1" step="1000" placeholder="100000" required>
        </div>
        <div class="modal__form-group">
          <label class="modal__label" for="invTxNotes">Catatan (opsional)</label>
          <input type="text" id="invTxNotes" name="notes" class="modal__input" placeholder="Deskripsi singkat">
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn--ghost modal__close">Batal</button>
          <button type="submit" class="btn btn--primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Navigasi utama">
    <a href="../index.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">🏠</span>
      <span class="bottom-nav__label">HOME</span>
    </a>
    <a href="01-guild-entrance.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">🔑</span>
      <span class="bottom-nav__label">LOGIN</span>
    </a>
    <a href="02-guild-hall.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">🏰</span>
      <span class="bottom-nav__label">HALL</span>
    </a>
    <a href="03-inventory.html" class="bottom-nav__item bottom-nav__item--active">
      <span class="bottom-nav__icon">🎒</span>
      <span class="bottom-nav__label">INVENTORY</span>
    </a>
    <a href="04-scroll-reading.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">📜</span>
      <span class="bottom-nav__label">IMPORT</span>
    </a>
  </nav>

  <div class="toast-container" aria-live="polite"></div>

  <script type="module" src="../scripts/screens/inventoryController.js"></script>
  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    const stored = localStorage.getItem('ffh-theme');
    if (stored === 'dark') root.classList.add('dark');
    if (stored === 'light') root.classList.add('light');
    themeBtn.addEventListener('click', () => {
      const isDark = root.classList.toggle('dark');
      root.classList.remove(isDark ? 'light' : 'dark');
      localStorage.setItem('ffh-theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
    });
    if (root.classList.contains('dark')) themeBtn.textContent = '☀️';

    function showToast(msg, type) {
      type = type || 'success';
      const c = document.querySelector('.toast-container');
      const t = document.createElement('div');
      t.className = 'toast toast--' + type;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.classList.add('toast--show'), 10);
      setTimeout(() => { t.classList.remove('toast--show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
  </script>
</body>
</html>
