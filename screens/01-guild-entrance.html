<!DOCTYPE html>
<html lang="id" class="guild-entrance">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Masuk — KelolaRacun</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="stylesheet" href="../styles/modern-theme.css">
  <link rel="stylesheet" href="../styles/components.css">
</head>
<body class="auth-shell">
  <header class="auth-top-bar" role="banner"></header>

  <main class="container auth-center">
    <div class="auth-brand-stacked text-center mb-6">
      <div class="auth-brand-icon" aria-hidden="true">✦</div>
      <h1 class="auth-brand-title">KelolaRacun</h1>
      <p class="text-tertiary text-xs">Family Finance Hub</p>
    </div>

    <div class="card p-8 auth-card">
      <div id="viewOnboarding" hidden>
        <div class="text-center mb-6">
          <div class="gate-mark gate-mark--warm" aria-hidden="true">✦</div>
          <p class="eyebrow">PROLOG / GUILD HALL</p>
          <h2 class="mb-2">Bangun Guild Keluarga</h2>
          <p class="text-tertiary text-sm">Buka gerbang pertama. Nama guild jadi jejak petualanganmu.</p>
        </div>

        <form id="onboardForm" novalidate>
          <div class="mb-6">
            <label class="block text-sm font-semibold mb-2" for="obGuildName">Nama Keluarga (Guild)</label>
            <input type="text" id="obGuildName" class="input" placeholder="Contoh: Keluarga Santoso" required maxlength="50" autocomplete="off">
            <p class="field-error" id="errObGuildName"></p>
          </div>
          <button type="submit" id="obSubmit" class="btn btn--primary w-full justify-center py-3 text-base">Mulai Petualangan</button>
        </form>
      </div>

      <div id="viewLogin" hidden>
        <div class="text-center mb-6">
          <div class="gate-mark gate-mark--cool" aria-hidden="true">◈</div>
          <p class="eyebrow">GERBANG PENJAGA</p>
          <h2 class="mb-2">Siapa yang datang?</h2>
          <p class="text-tertiary text-sm" id="loginSubtitle">Pilih penjaga untuk memasuki guild.</p>
        </div>

        <div id="stepPick">
          <div id="memberList" class="grid member-grid">
            <button type="button" class="guard-card guard-card--warm" data-id="zara" aria-label="Masuk sebagai Zara, Admin">
              <span class="guard-crest" aria-hidden="true">
                <svg viewBox="0 0 16 16" role="img" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 1h2v2h3v2h2v6h-2v2H9v2H7v-2H5v-2H3V5h2V3h2zM6 5h4v2H6zm-1 4h6v2H5z"/></svg>
              </span>
              <span class="guard-name">Zara</span>
              <span class="guard-role">Admin</span>
              <span class="guard-greeting">“Gerbang siap. Mari susun takdir.”</span>
              <span class="guard-action">Masuk <span aria-hidden="true">›</span></span>
            </button>
            <button type="button" class="guard-card guard-card--cool" data-id="dhika" aria-label="Masuk sebagai Dhika, Member">
              <span class="guard-crest" aria-hidden="true">
                <svg viewBox="0 0 16 16" role="img" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 1h2v2h2v2h2v2h2v3h-2v2h-2v2H9v1H7v-1H5v-2H3v-2H1V7h2V5h2V3h2zm1 4H6v2H4v2h3v2h2V9h3V7H9V5z"/></svg>
              </span>
              <span class="guard-name">Dhika</span>
              <span class="guard-role">Member</span>
              <span class="guard-greeting">“Langkah kecil, loot besar.”</span>
              <span class="guard-action">Masuk <span aria-hidden="true">›</span></span>
            </button>
          </div>
          <p class="field-error field-error--center" id="errPick"></p>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" aria-live="polite"></div>
  <script type="module" src="../scripts/ui.js"></script>
  <script type="module" src="../scripts/screens/loginController.js"></script>
</body>
</html>
