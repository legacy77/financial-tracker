<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — KelolaRacun</title>
  <link rel="stylesheet" href="../styles/modern-theme.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <header class="guild-banner" role="banner">
    <div class="container flex items-center justify-between" style="padding-top: var(--space-6); padding-bottom: var(--space-6);">
      <h1 class="guild-banner__title">🏰 KelolaRacun</h1>
    </div>
  </header>

  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding-top: var(--space-8); padding-bottom: var(--space-8);">
    <div class="card p-8" style="width: 100%; max-width: 440px;">
      <div class="text-center mb-6">
        <div class="text-4xl mb-3">🔐</div>
        <h2 class="mb-2">Masuk ke Guild</h2>
        <p class="text-tertiary text-sm">Pilih anggota keluarga, lalu masukkan PIN</p>
      </div>

      <!-- Member list -->
      <div id="memberList" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6);">
        <div class="text-tertiary text-sm p-4 text-center">Memuat anggota...</div>
      </div>

      <!-- PIN pad -->
      <div id="pinSection" style="display: none;">
        <div class="text-center mb-4">
          <p class="font-semibold" id="selectedMemberName">Pilih anggota</p>
          <p class="text-tertiary text-xs">Masukkan PIN 6 digit</p>
        </div>

        <form id="pinForm">
          <input type="password" id="pinInput" class="input" placeholder="••••••" maxlength="6" inputmode="numeric" pattern="\d{6}" autocomplete="current-password" autofocus required style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5em;">

          <div class="flex justify-between mt-4 mb-4">
            <button type="button" id="backToMembers" class="btn btn--ghost">← Kembali</button>
            <button type="button" id="clearPin" class="btn btn--ghost">Hapus</button>
          </div>

          <button type="submit" class="btn btn--primary w-full justify-center py-3">🔑 Masuk</button>
        </form>
      </div>

      <div class="divider"></div>

      <div class="text-center">
        <p class="text-tertiary text-sm">Belum punya akun? <a href="00-register.html" class="font-semibold">Buat Guild Baru</a></p>
      </div>
    </div>
  </main>

  <!-- Lockout overlay -->
  <div id="lockoutOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; color: white; text-align: center;">
    <div class="text-4xl mb-4">🔒</div>
    <h3 class="mb-2">Coba Lagi Nanti</h3>
    <p class="mb-4">Terlalu banyak PIN yang salah. Coba dalam <b id="lockoutTimer">60</b> detik.</p>
    <button class="btn btn--primary" id="lockoutRetry">Coba Lagi</button>
  </div>

  <div class="toast-container" aria-live="polite"></div>

  <script type="module" src="../scripts/screens/loginController.js"></script>
</body>
</html>
